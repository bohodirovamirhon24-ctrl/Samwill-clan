<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlest — Каталог ускуналар | Полный список техники</title>
    <style>
        /* Скопируй все CSS стили из root, body, top-bar, nav, logo, nav-links и common animations из index.html выше */
        
        :root { ... }
        * { ... }
        body { ... }
        @keyframes fadeInPage { ... }
        .top-bar { ... }
        .top-bar-container { ... }
        .top-phones a { ... }
        nav { ... }
        .nav-container { ... }
        .logo { ... }
        .logo span { ... }
        @keyframes gradientText { ... }
        @keyframes logoPulse { ... }
        .nav-links { ... }
        .nav-links a { ... }
        .nav-links a::after { ... }
        .nav-links a:hover { ... }
        .nav-links a:hover::after { ... }
        .nav-links a.active { ... }
        @keyframes slideDown { ... }
        @keyframes slideUp { ... }
        @keyframes fadeIn { ... }

        /* --- Специфичные стили для КАТАЛОГА --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .page-title { text-align: center; font-size: 2.8rem; margin-bottom: 40px; text-transform: uppercase; animation: slideUp 0.7s ease-out; }
        .page-title span { color: var(--primary); }

        /* Filter Buttons Animation */
        .filter-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; animation: fadeIn 1s ease-out 0.2s backwards; }
        .filter-btn {
            background: #181820; border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 15px var(--accent-glow); transform: scale(1.05); }

        /* 🔥 Анимированные КАРТОЧКИ 🔥 */
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card {
            background-color: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; opacity: 0;
            animation: cardAppear 0.6s ease-out forwards;
        }
        @keyframes cardAppear { from { opacity: 0; transform: translateY(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .card:hover { transform: translateY(-12px) scale(1.02); border-color: var(--primary); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px var(--accent-glow); }

        .card-img-box { height: 220px; background: #0d0d11; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-color); overflow: hidden; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .card:hover .card-img { transform: scale(1.1); }

        .card-badge {
            position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--primary); color: var(--primary); padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; z-index: 2;
            animation: pulseBadge 1.5s infinite alternate; backdrop-filter: blur(5px);
        }
        @keyframes pulseBadge { 0% { box-shadow: 0 0 5px rgba(255,102,0,0.3); } 100% { box-shadow: 0 0 15px rgba(255,102,0,0.7); } }

        .card-body { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        .card h3 { font-size: 1.35rem; color: #fff; margin-bottom: 15px; font-weight: 700; transition: color 0.3s; }
        .card:hover h3 { color: var(--primary); }
        .card-specs { list-style: none; margin-bottom: 22px; color: var(--text-muted); font-size: 0.92rem; flex-grow: 1; }
        .card-specs li { margin-bottom: 8px; padding-left: 20px; position: relative; }
        .card-specs li::before { content: "⚡"; position: absolute; left: 0; font-size: 0.8rem; }

        .btn-telegram {
            background-color: #0088cc; color: white; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; text-align: center; display: block; margin-top: auto;
            transition: all 0.3s ease;
        }
        .btn-telegram:hover { background-color: #0077b3; box-shadow: 0 0 15px rgba(0, 136, 204, 0.6); transform: translateY(-2px); }

        footer { background-color: #050507; border-top: 1px solid var(--border-color); padding: 40px 20px; text-align: center; margin-top: 60px; color: var(--text-muted); animation: fadeIn 1s ease-out 0.8s backwards; }
    </style>
</head>
