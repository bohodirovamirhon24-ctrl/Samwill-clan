<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlest — Каталог ускуналар</title>
    <style>
        :root {
            --primary: #ff6600;
            --bg-dark: #0a0a0d;
            --card-bg: #141418;
            --text-light: #ffffff;
            --text-muted: #a0a0ab;
            --border-color: #24242c;
            --accent-glow: rgba(255, 102, 0, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); }

        nav { background-color: rgba(10, 10, 13, 0.9); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        
        .logo { font-size: 2.2rem; font-weight: 900; color: #fff; text-decoration: none; }
        .logo span { color: var(--primary); }

        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 600; padding: 5px 10px; }
        .nav-links a.active { color: var(--primary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        .filter-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { background: #181820; border: 1px solid var(--border-color); color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .filter-btn.active { background: var(--primary); border-color: var(--primary); }

        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; }
        .card-img-box { height: 200px; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card h3 { margin-bottom: 10px; font-size: 1.2rem; }
        .card-specs { list-style: none; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; flex-grow: 1; }

        .btn-telegram { background-color: #0088cc; color: #fff; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">SHER<span>LEST</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Bosh sahifa</a></li>
                <li><a href="catalog.html" class="active">Каталог</a></li>
                <li><a href="conditions.html">Шартлар</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 style="text-align: center; margin-bottom: 30px;">Ускуналар каталоги</h1>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCatalog('all', event)">Барчаси</button>
            <button class="filter-btn" onclick="filterCatalog('height', event)">Нарвон / Леса</button>
            <button class="filter-btn" onclick="filterCatalog('heavy', event)">Оғир техника</button>
            <button class="filter-btn" onclick="filterCatalog('tools', event)">Инструментлар</button>
        </div>

        <div class="catalog-grid">
            <div class="card" data-category="heavy">
                <div class="card-img-box"><img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=800" class="card-img"></div>
                <div class="card-body">
                    <h3>Гидравлическая Рохля</h3>
                    <ul class="card-specs"><li>Грузоподъемность: 2.5 - 3 тонны</li></ul>
                    <a href="https://t.me/Narvon24" class="btn-telegram" target="_blank">Заказать в Telegram</a>
                </div>
            </div>

            <div class="card" data-category="heavy">
                <div class="card-img-box"><img src="https://images.unsplash.com/photo-1590247813693-5541d1c609fd?w=800" class="card-img"></div>
                <div class="card-body">
                    <h3>Бензиновый Генератор</h3>
                    <ul class="card-specs"><li>Мощность: от 3 кВт до 15 кВт</li></ul>
                    <a href="https://t.me/Narvon24" class="btn-telegram" target="_blank">Заказать в Telegram</a>
                </div>
            </div>

            <div class="card" data-category="height">
                <div class="card-img-box"><img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800" class="card-img"></div>
                <div class="card-body">
                    <h3>Лестницы и Стремянки</h3>
                    <ul class="card-specs"><li>Высота: от 2m до 10m</li></ul>
                    <a href="https://t.me/Narvon24" class="btn-telegram" target="_blank">Заказать в Telegram</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function filterCatalog(category, event) {
            const cards = document.querySelectorAll('.card');
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
