<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlest — Главная | Аренда спецтехники в Ташкенте</title>
    <style>
        :root {
            --primary: #ff6600;
            --primary-glow: #ff8533;
            --bg-dark: #0a0a0d;
            --card-bg: #141418;
            --text-light: #ffffff;
            --text-muted: #a0a0ab;
            --border-color: #24242c;
            --accent-glow: rgba(255, 102, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; scroll-behavior: smooth; }
        
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; overflow-x: hidden; opacity: 0; animation: fadeInPage 0.6s ease-out forwards; }

        @keyframes fadeInPage { to { opacity: 1; } }

        /* Top Bar & Top Phones */
        .top-bar { background: #050507; border-bottom: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.88rem; animation: slideDown 0.5s ease-out; }
        .top-bar-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .top-phones a { color: var(--primary); text-decoration: none; font-weight: 800; margin-left: 15px; display: inline-block; transition: 0.3s; }
        .top-phones a:hover { transform: scale(1.05); text-shadow: 0 0 10px var(--primary); }

        /* Navigation */
        nav { background-color: rgba(10, 10, 13, 0.9); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border-color); backdrop-filter: blur(10px); animation: slideDown 0.5s ease-out 0.1s backwards; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }

        /* 🔥 Анимированный Логотип 🔥 */
        .logo { font-size: 2.2rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: 2px; text-transform: uppercase; display: inline-block; transition: 0.3s; }
        .logo span {
            background: linear-gradient(90deg, #ff6600, #ffaa00, #ff3300, #ff6600);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoPulse 2s ease-in-out infinite alternate, gradientText 4s linear infinite;
        }
        .logo:hover { transform: scale(1.03) rotate(-1deg); }

        @keyframes gradientText { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes logoPulse { 0% { filter: drop-shadow(0 0 5px rgba(255,102,0,0.4)); } 100% { filter: drop-shadow(0 0 15px rgba(255,102,0,0.8)); } }

        /* 🔥 Анимированное Меню 🔥 */
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: 0.3s;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--primary);
        }
        .nav-links a:hover { color: var(--primary); background: rgba(255,102,0,0.05); }
        .nav-links a:hover::after { width: 80%; }
        .nav-links a.active { color: var(--primary); background: rgba(255,102,0,0.1); }
        .nav-links a.active::after { width: 80%; }

        /* Hero */
        .hero { padding: 120px 20px; text-align: center; background: radial-gradient(circle at center, rgba(255, 102, 0, 0.15) 0%, rgba(10, 10, 13, 1) 80%); overflow: hidden; }
        .hero h1 { font-size: 3.8rem; margin-bottom: 20px; animation: slideUp 0.7s ease-out backwards; }
        .hero p { color: var(--text-muted); font-size: 1.3rem; max-width: 750px; margin: 0 auto 40px; animation: fadeIn 1s ease-out 0.3s backwards; }
        .hero .btn { animation: slideUp 0.6s ease-out 0.5s backwards; }

        /* Buttons */
        .btn { padding: 15px 30px; border-radius: 12px; font-weight: 700; text-decoration: none; display: inline-block; cursor: pointer; border: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 5px 15px var(--accent-glow); }
        .btn-primary:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 10px 30px rgba(255, 102, 0, 0.6); }

        /* Common Animations */
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { background-color: #050507; border-top: 1px solid var(--border-color); padding: 40px 20px; text-align: center; margin-top: 60px; color: var(--text-muted); animation: fadeIn 1s ease-out 0.8s backwards; }
    </style>
</head>
