    <style>
        /* Скопируй все CSS стили из root, body, top-bar, nav, logo, nav-links и common animations из index.html выше */
        
        :root { ... }
        * { ... }
        body { ... }
        @keyframes fadeInPage { ... }
        .top-bar { ... }
        .top-bar-container { ... }
        .top-phones a { ... }
        nav { ... }
        .nav-container { ... }
        .logo { ... }
        .logo span { ... }
        @keyframes gradientText { ... }
        @keyframes logoPulse { ... }
        .nav-links { ... }
        .nav-links a { ... }
        .nav-links a::after { ... }
        .nav-links a:hover { ... }
        .nav-links a:hover::after { ... }
        .nav-links a.active { ... }
        @keyframes slideDown { ... }
        @keyframes slideUp { ... }
        @keyframes fadeIn { ... }

        /* --- Специфичные стили для КОНТАКТОВ --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; }
        .page-title { text-align: center; margin-bottom: 40px; font-size: 2.5rem; text-transform: uppercase; animation: slideUp 0.7s ease-out; }
        .page-title span { color: var(--primary); }

        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }

        /* 🔥 Анимированные БЛОКИ 🔥 */
        .card-box {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-top: 4px solid var(--primary); border-radius: 14px; padding: 30px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; animation: cardAppear 0.6s ease-out forwards;
        }
        .card-box:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow); }

        .card-box h2 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .card-box:hover h2 { text-shadow: 0 0 10px var(--primary); }
        .card-box p, .card-box li { color: var(--text-muted); margin-bottom: 12px; font-size: 1.05rem; }
        .card-box ul { list-style: none; }

        /* 🔥 Анимированные Кнопки Контактов 🔥 */
        .phone-btn {
            display: block; background: rgba(255, 102, 0, 0.05); border: 1px solid var(--primary); color: #fff; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 1.1rem; margin-top: 15px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .phone-btn:hover { background: var(--primary); box-shadow: 0 5px 20px var(--accent-glow); transform: translateY(-3px) scale(1.02); }

        .tg-btn {
            display: block; background: #0088cc; color: #fff; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 1.1rem; margin-top: 15px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tg-btn:hover { background: #0077b3; box-shadow: 0 5px 20px rgba(0, 136, 204, 0.6); transform: translateY(-3px) scale(1.02); }

        footer { background-color: #050507; border-top: 1px solid var(--border-color); padding: 30px 20px; text-align: center; margin-top: 60px; color: var(--text-muted); animation: fadeIn 1s ease-out 0.8s backwards; }
    </style>
